name: OIDC debug (temporary)
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC claims npm would see (token itself is not printed)
        run: |
          tok=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "$tok" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s);for(const k of ["aud","sub","repository","repository_owner","repository_id","repository_owner_id","workflow","workflow_ref","job_workflow_ref","environment","ref","ref_type","runner_environment","repository_visibility"])console.log(k+" = "+c[k])})'
