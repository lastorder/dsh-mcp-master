name: Release

# Push a tag like v0.1.0 (matching package.json "version") to publish to npm.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm run verify
      # npm >= 11.5 supports Trusted Publishing (OIDC); with it configured on npmjs.com no token is needed.
      - run: npm install -g npm@latest
      - name: Publish (skipped if this version is already on npm)
        run: |
          if npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "Version already published; skipping."
          else
            npm publish --provenance --access public --ignore-scripts
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
